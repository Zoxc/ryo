[package]
name = "rustc_codegen_ryo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
ryo_bytecode = { path = "../vm/bytecode" }
# The version rustc 1.99.1's own compiler crates use (`rustc_codegen_ssa/Cargo.toml`). The
# sysroot's copies can't be named: `extern crate object` finds three candidates there.
object = { version = "=0.38.1", default-features = false, features = ["std", "write_std", "elf", "coff", "read_core", "archive"] }

# Not a member of any workspace.
[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
