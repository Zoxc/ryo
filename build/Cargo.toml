[package]
name = "y"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "intel"] }

# Not a member of any workspace.
[workspace]

# Line tables keep backtraces readable at a fraction of full debuginfo's disk use.
[profile.dev]
debug = "line-tables-only"
