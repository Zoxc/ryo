name = "ryo"
version = "0.1.0"
defaultTargets = ["Ryo", "ryo-lean"]
testDriver = "ryotest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Ryo"

# The proofs too slow for the default build: `lake build RyoProofs` (README.md).
[[lean_lib]]
name = "RyoProofs"

[[lean_lib]]
name = "RyoTest"
globs = ["RyoTest", "RyoTest.+"]

[[lean_exe]]
name = "ryo-lean"
root = "Main"

[[lean_exe]]
name = "ryotest"
root = "RyoTestMain"
