[package]
name = "ryo_jit"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

# The JIT (design/jit.md): the compiler thread that `ryo_rt`'s trips start through
# `ryo_jit_start`. It sees the runtime only through `ryo_bytecode::jit_abi::RtApi`.

[dependencies]
ryo_bytecode = { path = "../bytecode" }

[dev-dependencies]
# The tests run hand-assembled functions through the runtime's trips into this JIT.
ryo_rt = { path = "../rt", features = ["pe-test"] }
